# ==============================================================================
# RevEx ASE – Master Environment Configuration
# Optimised for: Intel Core i9 | 128 GB RAM | RTX A6000 Ada 48 GB
# ==============================================================================

hardware:
  gpu: "rtx_6000_ada"
  vram_gb: 48
  system_ram_gb: 128
  mixed_precision: true
  intra_op_threads: 24          # match physical P‑cores
  inter_op_threads: 4
  cache_library_in_ram: true    # pre‑loads entire motion library into RAM
  pin_gpu_memory: true          # non‑blocking pinned memory transfers

paths:
  raw_media: "raw_media/"                           # input videos for data pipeline
  motion_library: "data/unified_motion_library.json" # output of pipeline / input to Phase 2
  checkpoints: "checkpoints/"
  tensorboard: "runs/"
  logs: "logs/"

physics:
  sim_dt: 0.005                 # 200 Hz physics
  decimation: 4                 # 50 Hz policy (20 ms control loop)